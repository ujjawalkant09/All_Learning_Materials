[project]
name = "agentic-ai-learning"
version = "0.1.0"
description = "Revision notebooks for LangChain v1, LangGraph and agent projects"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # core
    "langchain>=1.3.14",
    "langchain-core>=1.5.0",
    "langchain-community>=0.4.2",
    "langgraph>=1.2.9",
    "langsmith>=0.10.9",
    "python-dotenv>=1.2.2",
    "ipykernel>=7.3.0",
    # model providers
    "langchain-openai>=1.4.0",
    "langchain-groq>=1.1.3",
    "langchain-google-genai>=4.2.7",
    # tools used by the agents
    "arxiv>=4.0.1",
    "wikipedia>=1.4.0",
    "ddgs>=9.14.4",
    # RAG (next module)
    "pypdf>=6.14.2",
    "pymupdf>=1.28.0",
    "sentence-transformers>=5.6.0",
    "faiss-cpu>=1.14.3",
    "chromadb>=1.5.9",
    "typesense>=2.0.0",
]
