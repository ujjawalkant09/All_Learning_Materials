# Single-node Elasticsearch for LEARNING ONLY (security disabled, no TLS, no password).
#   docker compose up -d          # start (first time downloads ~1 GB)
#   curl localhost:9200           # check it's up
#   docker compose down -v        # stop and delete data
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: es-rag-lab
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.license.self_generated.type=trial   # 30-day trial unlocks every feature (e.g. RRF in older versions)
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data

volumes:
  es-data:
