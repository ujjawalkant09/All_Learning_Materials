apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: deploy2
  name: deploy2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: deploy2
  strategy: {}
  template:
    metadata:
      labels:
        app: deploy2
    spec:
      containers:
      - image: sentientlabsolutions/learning_repo:2.0
        name: env-variable-learning
        env:
        - name: APP_NAME
          value: "kubernetes-101"
        ports:
        - containerPort: 3000

