apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-app
  template:
    metadata:
      labels:
        app: hello-app
    spec:
      containers:
        - name: hello-app
          image: public.ecr.aws/nginx/nginx:alpine-slim
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "20Mi"
              cpu: "0.25"
            limits:
              memory: "50Mi"
              cpu: "0.5"