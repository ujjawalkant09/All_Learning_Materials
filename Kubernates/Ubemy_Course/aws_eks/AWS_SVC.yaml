apiVersion: v1
kind: Service
metadata:
  name: hello-app-service
  annotations:
    # Make the NLB internet-facing instead of internal
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    # Ensure targets are pod IPs (keeps NodePort/Security Group handling simple)
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    # Optional: pin to specific public subnets (uncomment and set IDs if needed)
    # service.beta.kubernetes.io/aws-load-balancer-subnets: subnet-AAAA,subnet-BBBB
spec:
  selector:
    app: hello-app
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
  type: LoadBalancer
