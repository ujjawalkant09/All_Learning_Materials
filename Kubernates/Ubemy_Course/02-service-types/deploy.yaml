apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: sample
  name: sample
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sample
  strategy: {}
  template:
    metadata:
      labels:
        app: sample
    spec:
      containers:
      - image: nginx
        name: nginx
        ports:
        - containerPort: 80
        
status: {}
