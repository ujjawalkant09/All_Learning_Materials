apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-deployment 
spec:
  replicas: 3 
  selector:
    matchLabels:
      app: hello-app 
  template:
    metadata:
      labels: 
        app: hello-app 
    spec:
      containers: 
        - name: hello-container 
          image: sentientlabsolutions/hello-k8s:v1 
          imagePullPolicy: IfNotPresent 
          ports: 
            - containerPort: 3000